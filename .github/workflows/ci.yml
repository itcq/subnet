name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Supabase migration and pgTAP authorization
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm run backend:start

      - name: Apply migrations from a clean database
        run: npm run backend:reset

      - name: Run pgTAP authorization suite
        shell: bash
        run: |
          set -o pipefail
          npm run backend:test 2>&1 | tee pgtap.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              echo "::error::$line"
            done < <(tail -n 25 pgtap.log)
          fi
          exit "$status"

  verify:
    name: Test, lint, typecheck, doctor, and export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run project quality gate
        run: npm run check

      - name: Export production web artifact
        run: npm run export:web

      - name: Verify public release artifact
        run: npm run verify:release

      - name: Upload production web artifact
        uses: actions/upload-artifact@v4
        with:
          name: subnet-game-web
          path: dist
          if-no-files-found: error
